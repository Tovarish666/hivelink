# Loose reverse-path filter. При policy routing ответный трафик приходит не в
# ту таблицу, из которой ушёл запрос, и strict rp_filter (=1) его молча съедает.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Сорок модемов + ARP каждого — таблица соседей переполняется и начинается
# "neighbour table overflow" с потерей пакетов на ровном месте.
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192

# У каждого модема свой /24 и свой шлюз .1 — ARP-ответы должны быть строго
# по интерфейсу, иначе при одинаковых MAC у модемов начинается путаница.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
