# hivelink — параметры ядра для фермы модемов.
#
# rp_filter=2      строгая проверка обратного пути (1) ломает policy routing:
#                  ответы уходят не через тот интерфейс и отбрасываются
# arp_ignore=1     вся партия E3372 имеет ОДИН И ТОТ ЖЕ MAC, без этого
# arp_announce=2   ARP-ответы уезжают в чужую подсеть и раскладка путается
# gc_thresh*       десятки подсетей переполняют neighbour table

net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2

net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192

net.ipv4.ip_forward = 1
