# =============================================================================
#  /etc/e3372/e3372.conf — переопределение настроек драйвера.
#  Обычный shell-файл, подключается через `.`. Все значения ниже — умолчания;
#  раскомментируйте только то, что меняете. Файл при обновлении не перезаписывается.
# =============================================================================

# --- Выбор USB-конфигурации --------------------------------------------------
# Целевой сетевой драйвер. Практика показывает, что на E3372 RNDIS ведёт себя
# стабильнее CDC-ECM, поэтому он выбран целью; если у конкретной модели
# RNDIS-конфигурации нет, драйвер сядет на FALLBACK и скажет об этом в журнал.
#PREFER_DRIVER=rndis_host
#FALLBACK_DRIVERS="cdc_ether"

# Драйверы, которые считаются нерабочими: raw-IP, без DHCP и без web-API.
# Устройство на такой конфигурации будет переведено на другую.
#BAD_DRIVERS="huawei_cdc_ncm cdc_mbim cdc_ncm qmi_wwan"

# Сколько конфигураций перебрать, прежде чем сесть на лучшую из виденных.
#CFG_MAX_TRIES=8
# Сколько циклов ждать привязки драйвера, прежде чем счесть конфигурацию пустой.
#NODRV_GRACE=3

# --- Адресация ---------------------------------------------------------------
# Модем N живёт в HOST_PREFIX.N.0/24: сам на .GW_OCTET, хосту выдаёт .HOST_OCTET
#HOST_PREFIX=192.168
#HOST_OCTET=100
#GW_OCTET=1
#RULE_PRIO_BASE=1000

# --- Zero-CD -----------------------------------------------------------------
#ZEROCD_MAX_TRIES=3      # попыток usb_modeswitch до принудительного re-enumerate

# --- HiLink web-API ----------------------------------------------------------
#AUTO_DATASWITCH=1       # включать мобильные данные, если выключены
#AUTO_RECONNECT=1        # дозваниваться, если ConnectionStatus не 901
#RECONNECT_COOLDOWN=180  # сек между попытками дозвона на один модем
#HILINK_EVERY=4          # раз в сколько циклов опрашивать web-API
#HILINK_CONCURRENCY=8    # сколько модемов опрашивать параллельно

# --- Прочее ------------------------------------------------------------------
#USB_AUTOSUSPEND_OFF=1
#DHCP_MAX_TRIES=10
#DNS_FALLBACK="1.1.1.1 8.8.8.8"
#SKIP_SUBNET_COLLISION=1 # не трогать модем, чья подсеть уже занята хостом
#QUIET_REPEAT=300        # сек: не повторять одинаковое сообщение чаще

# ---------------------------------------------------------------------------
# Фикс скорости приёма (баг rndis_host)
# ---------------------------------------------------------------------------
# Драйвер сообщает модему max_transfer_size = 2048, тот режет батчи под это
# число, и RNDIS-сообщения не помещаются в один URB. Собирать сообщение через
# границу URB rndis_host не умеет — ~85% приёма уходит в length/frame ошибки.
# Симптом: download ~1.3 Мбит при нормальном upload.
# Замерено на K5160: было 1.26, стало 46.58 Мбит/с.
#
# Значение подбирается замером; 0 полностью отключает фикс и возвращает
# штатное поведение ядра.
#RX_URB_SIZE=16384
