# hivelink — конфигурация фермы USB-модемов.
# Файл читается как shell-скрипт. Меняй значения, комментарии не трогай.
# После правки:  hivelink rescan

# ------------------------------------------------------------- адресация ---
# Модем со слотом N получает подсеть $HL_SUBNET_PREFIX.N.0/24,
# сам модем сидит на .$HL_GW_OCTET, хост берёт .$HL_HOST_OCTET.
#HL_SUBNET_PREFIX=192.168
#HL_HOST_OCTET=100
#HL_GW_OCTET=1

# Диапазон номеров слотов. Номер закрепляется за физическим USB-портом
# навсегда — новый модем не сдвигает раскладку соседей.
# Номер это третий октет подсети, поэтому предел — 253 модема на префикс.
# Нужно больше — заводи второй префикс (например 10.10) на другом хосте.
#HL_SLOT_MIN=2
#HL_SLOT_MAX=254

# Жёсткая привязка «USB-порт:номер», через пробел. Приоритет надо всем,
# переживает потерю /var/lib/hivelink/slots и переезд на другой хост.
# Нужна, когда адрес модема уже зашит во внешние системы и менять его нельзя.
# USB-путь смотри в выводе: hivelink slots   (или lsusb -t)
#HL_SLOT_PIN="3-3:104 3-1.4.1.1:101"

# Имя интерфейса = префикс + номер слота (mdm101, mdm102, ...).
# По MAC имена строить нельзя: вся партия E3372 имеет один и тот же MAC.
#HL_IFACE_PREFIX=mdm

# База таблиц policy routing. Модем N использует таблицу BASE+N.
#HL_TABLE_BASE=10000


# --------------------------------------------------------------- драйвер ---
# auto — брать из реестра устройств (рекомендуется).
# Иначе можно жёстко: rndis_host | cdc_ether | cdc_ncm
#HL_PREFER_DRIVER=auto

# ОБХОД БАГА ЯДРА. rndis_host сообщает модему max_transfer_size = 2048,
# из-за чего RNDIS-сообщения рвутся между URB и ~85% приёма уходит в мусор.
# Симптом: download ~1 Мбит при нормальном upload.
# Значение подбирается замером: hivelink speed <slot>
# 0 — выключить обход и вернуться к штатному поведению ядра.
#HL_RX_URB_SIZE=16384


# ------------------------------------------------------------------- DNS ---
# Модем раздаёт себя как DNS-сервер. Если это попадёт в /etc/resolv.conf,
# резолвинг всего хоста уедет в случайный модем.
# Страж проверяет резолвер каждый цикл и чинит, если HL_DNS_UPSTREAM задан.
#HL_DNS_GUARD=1

# Ваши настоящие DNS. Без них страж только предупреждает, но не чинит.
#HL_DNS_UPSTREAM="1.1.1.1 8.8.8.8"


# ---------------------------------------------------------------- HiLink ---
# Работа с веб-API модема (192.168.N.1): статус, включение передачи данных,
# переподключение, чтение SMS.
#HL_HILINK_ENABLE=1
#HL_HILINK_TIMEOUT=6
#HL_HILINK_DATASWITCH=1


# -------------------------------------------------------------- Zero-CD ----
# Свежий модем приходит как CD-ROM и требует usb_modeswitch.
# HL_MODESWITCH_REQUIRED=1 означает: отсутствие usb_modeswitch — это ОШИБКА,
# а не повод молча пропустить стадию. Именно на этом горел прошлый стек.
#HL_ZEROCD_TRIES=3
#HL_MODESWITCH_REQUIRED=1


# -------------------------------------------------------------- watchdog ---
#HL_WATCHDOG_ENABLE=1
#HL_WATCHDOG_PING=1.1.1.1
#HL_WATCHDOG_FAILS=3

# Разрешить ступень 4 — сброс USB-устройства у глухого модема.
# Выключи, если сброс мешает соседям по хабу.
#HL_WATCHDOG_ESCALATE=1


# -------------------------------------------------------------- масштаб ----
# Структурная часть цикла дешёвая, а пинги и веб-API стоят секунд.
# Поэтому модемы обрабатываются параллельно, а проверки живости идут
# по расписанию, а не на каждом цикле.

# Число рабочих потоков. auto = удвоенное число ядер, но не больше 32.
# Упираемся не в CPU, а в таймауты сети.
#HL_PARALLEL=auto

# Как часто проверять живость каждого модема (сек). Модем, уже находящийся
# в неудачах, проверяется каждый цикл независимо от этого значения.
# При 200 модемах не опускай ниже 60.
#HL_HEALTH_INTERVAL=120

# Убирать правила и таблицы маршрутов слотов, которых больше нет.
# Без этого сменивший номер модем оставляет за собой правило, которое
# потом перехватит трафик чужого модема. Выключай только для отладки.
#HL_GC=1


# ------------------------------------------------------------------ лог ----
#HL_LOG_LEVEL=info          # debug | info | warn | error
#HL_LOG_STDERR=auto         # auto | 1 | 0


# ------------------------------------------------- реестр устройств --------
# Строка: "vid:pid  семейство  драйвер"
# Семейства: hilink (веб-API + свой DHCP), ncm, ether, generic.
# Неизвестные устройства не отвергаются — семейство определяется
# по классам USB-интерфейсов. Дополняй таблицу под свой парк.
#HL_REGISTRY='
#12d1:14db hilink rndis_host
#12d1:14dc hilink cdc_ether
#12d1:1506 ncm    cdc_ncm
#'

# Вендоры, которые вообще рассматриваются как модемы (через пробел).
#HL_VENDORS="12d1"
